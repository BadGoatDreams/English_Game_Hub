<body>
<a href="index.html" class="back-btn" style="position: fixed; top: 15px; left: 15px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 10px 15px; border-radius: 20px; text-decoration: none; font-weight: bold; z-index: 10000; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">← Back to Hub</a>

<div class="container">
    <h1>Classroom English Hub</h1>
    <p class="subtitle">Because staring in silence is uncomfortable for everyone.</p>
    
    <span class="label">English Level</span>
    <select id="level">
        <option value="basic">Basic</option>
        <option value="intermediate" selected>Intermediate</option>
        <option value="advanced">Advanced</option>
    </select>

    <div class="button-grid">
        <button onclick="getTopic()">Random Topic</button>
        <button class="btn-silly" onclick="getQuestion('silly')">Silly Question</button>
        <button onclick="getQuestion('serious')">Serious Question</button>
        <button class="btn-wyr" onclick="getWYR()">Would You Rather?</button>
        <button class="btn-game" onclick="getTwister()">Tongue Twister</button>
        <button class="btn-game" onclick="getScramble()">Word Scramble</button>
        <button class="btn-game" onclick="getWOTD()">Word of the Day</button>
        <button class="btn-taboo" onclick="getTaboo()">Vocab Taboo</button>
    </div>

    <div id="display-area">
        <div id="text-output">Select an activity to begin.</div>
        <button id="reveal-btn" class="btn-reveal" onclick="revealAnswer()">Reveal Answer</button>
    </div>
</div>

            { word: "Movie", forbidden: ["Watch", "Cinema", "Actors", "Popcorn", "Film"] },
            { word: "Winter", forbidden: ["Snow", "Cold", "Ice", "December", "Freeze"] },
            { word: "Airplane", forbidden: ["Fly", "Sky", "Wings", "Pilot", "Airport"] },
            { word: "Money", forbidden: ["Buy", "Cash", "Bank", "Pay", "Dollars"] },
            { word: "Guitar", forbidden: ["Music", "Strings", "Play", "Instrument", "Rock"] },
            { word: "Teacher", forbidden: ["School", "Students", "Class", "Learn", "Board"] },
            { word: "Sun", forbidden: ["Hot", "Yellow", "Sky", "Star", "Day"] },
            { word: "Ocean", forbidden: ["Water", "Blue", "Swim", "Fish", "Sea"] },
            { word: "Clock", forbidden: ["Time", "Watch", "Hands", "Hour", "Tick"] },
            { word: "Camera", forbidden: ["Photo", "Picture", "Lens", "Shoot", "Flash"] },
            { word: "Mirror", forbidden: ["Look", "Reflection", "Glass", "Face", "See"] },
            { word: "Shoes", forbidden: ["Feet", "Walk", "Wear", "Sneakers", "Socks"] },
            { word: "Rain", forbidden: ["Water", "Drops", "Sky", "Wet", "Umbrella"] }
        ]
    };

    let currentAnswer = "";
    const display = document.getElementById('text-output');
    const revealBtn = document.getElementById('reveal-btn');
    const levelSelect = document.getElementById('level');

    function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function resetUI() {
        revealBtn.style.display = "none";
        currentAnswer = "";
    }

    function getTopic() {
        resetUI();
        display.innerText = "Topic: " + getRandom(data.topics[levelSelect.value]);
    }

    function getQuestion(type) {
        resetUI();
        display.innerText = type === 'silly' ? getRandom(data.questions.silly) : getRandom(data.questions.serious[levelSelect.value]);
    }

    function getWYR() { resetUI(); display.innerText = getRandom(data.wyr); }
    function getTwister() { resetUI(); display.innerText = "Try: " + getRandom(data.twisters); }

    function getScramble() {
        resetUI();
        const word = getRandom(data.scramble[levelSelect.value]);
        currentAnswer = word;
        const scrambled = word.split('').sort(() => Math.random() - 0.5).join('');
        display.innerText = "Unscramble: " + scrambled;
        revealBtn.style.display = "block";
    }

    function revealAnswer() {
        display.innerText = "Answer: " + currentAnswer;
        revealBtn.style.display = "none";
    }

    function getWOTD() {
        resetUI();
        display.innerText = "Word of the Day: " + getRandom(data.wotd[levelSelect.value]);
    }

    function getTaboo() {
        resetUI();
        const item = getRandom(data.taboo);
        display.innerHTML = `<div class="taboo-word">${item.word}</div><div class="forbidden">Don't say: ${item.forbidden.join(', ')}</div>`;
    }
</script>
